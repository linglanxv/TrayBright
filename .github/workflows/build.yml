name: Build TrayBright

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # 允许 GITHUB_TOKEN 创建 Release 并上传附件
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 发布单文件 exe
        run: dotnet publish TrayBright/TrayBright.csproj -c Release -r win-x64 -o publish

      - name: 重命名产物
        shell: pwsh
        run: Copy-Item publish/TrayBright.exe TrayBright.exe

      - name: 上传构建产物（Actions 页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: TrayBright-win-x64
          path: TrayBright.exe

      - name: 发布到 Releases（推送 v* 标签时自动创建 Release 并附加 exe）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TrayBright.exe
          generate_release_notes: true
